# Раздача SPA внутри контейнера fin-web. Внешний ingress (infra-nginx) проксирует сюда
# только "/" — здесь нет ни TLS, ни маршрутизации по домену, только статика.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # version.json — свежий buildId для плашки «доступна новая версия», без кэша.
    # Точный location обязателен: иначе SPA-fallback ниже вернёт на этот путь index.html
    # с кодом 200, разбор JSON на клиенте упадёт и плашка никогда не появится.
    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
