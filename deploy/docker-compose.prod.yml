# Портал «КС» (fin) — production-профиль для backend-vps-1 (single-VPS baseline, корпстандарт v3.1).
# Собирается и разворачивается через `deploy-fin` (deploy/deploy-fin.sh), portal-scoped —
# не затрагивает соседние порталы, infra-nginx, Keycloak.
#
# БД — внешний Yandex Managed PostgreSQL, в compose не входит.
# Nginx (infra-nginx) и Keycloak — отдельные инфраструктурные compose-проекты (/opt/infra/*),
# сюда не включаются; единственная точка входа к api/web — общая внешняя docker-сеть `edge`
# (создаётся один раз: docker network create edge). Портов наружу этот файл не публикует.
#
# Миграции — отдельный шаг (роль fin_migration, DDL), не из api/worker:
#   docker compose -f deploy/docker-compose.prod.yml -p fin run --rm migrate
# Первый администратор — отдельный шаг, один раз после первого --migrate:
#   docker compose -f deploy/docker-compose.prod.yml -p fin run --rm seed
#
# Подробности первичной настройки (роли БД, /etc/fin, nginx) — см. deploy/README.md

services:
  fin-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: fin-api:${FIN_TAG:-latest}
    command: ['node', 'dist/api/index.js']
    env_file: /etc/fin/fin.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0   # дефолт кода — 127.0.0.1, в контейнере недостижим извне без этого
    networks: [edge]
    volumes:
      - uploads:/app/.data/uploads
      - /etc/fin/root.crt:/etc/fin/root.crt:ro
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  fin-worker:
    image: fin-api:${FIN_TAG:-latest}   # тот же образ, что fin-api (build объявлен только там)
    command: ['node', 'dist/worker/index.js']
    env_file: /etc/fin/fin.env
    environment:
      NODE_ENV: production
    networks: [edge]
    volumes:
      - uploads:/app/.data/uploads
      - /etc/fin/root.crt:/etc/fin/root.crt:ro
    restart: unless-stopped
    # разбор Excel идёт в дочернем процессе (heap 512 МБ) — лимит контейнера покрывает оба процесса
    mem_limit: 1g
    memswap_limit: 1280m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # SIGTERM: worker дорабатывает текущую задачу (до PARSE_TIMEOUT_MS=60s) перед остановкой
    stop_grace_period: 90s

  fin-web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: fin-web:${FIN_TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    mem_limit: 64m
    memswap_limit: 128m
    pids_limit: 128
    # мастер-процессу nginx нужен NET_BIND_SERVICE для :80 — полный cap_drop недопустим
    cap_drop: [SYS_ADMIN, SYS_PTRACE, NET_RAW, MKNOD, AUDIT_WRITE]
    security_opt: ['no-new-privileges:true']

  # Разовый накат SQL-миграций (роль fin_migration, DDL). DATABASE_URL здесь ПЕРЕОПРЕДЕЛЁН
  # переменной окружения хоста — сама DDL-роль в /etc/fin/fin.env (env_file) не хранится,
  # чтобы права на DDL не оказались в рантайм-контейнерах api/worker. Значение подставляет
  # deploy-fin.sh из отдельного /etc/fin/fin-migrate.env; пустое значение — осознанный fail-fast
  # (zod DATABASE_URL: min(1) в backend/src/config.ts).
  migrate:
    image: fin-api:${FIN_TAG:-latest}
    command: ['node', 'dist/scripts/migrate.js']
    profiles: ['tools']
    env_file: /etc/fin/fin.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
    networks: [edge]
    volumes:
      - /etc/fin/root.crt:/etc/fin/root.crt:ro
    restart: 'no'
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  # Сид первого администратора — один раз вручную после первого --migrate (см. deploy/README.md).
  # Роли fin_runtime (env_file) достаточно: seed делает обычный INSERT, не DDL.
  seed:
    image: fin-api:${FIN_TAG:-latest}
    command: ['node', 'dist/scripts/seed.js']
    profiles: ['tools']
    env_file: /etc/fin/fin.env
    environment:
      NODE_ENV: production
    networks: [edge]
    volumes:
      - /etc/fin/root.crt:/etc/fin/root.crt:ro
    restart: 'no'
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

volumes:
  uploads:

networks:
  edge:
    external: true
