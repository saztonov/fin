# Production-профиль портала «КС» для backend-vps-1 (single-VPS baseline, корпстандарт v3.1).
# БД — Yandex Managed PostgreSQL (в compose НЕ входит). Nginx и Keycloak — отдельные
# инфраструктурные compose-проекты (/opt/infra/*), сюда не включаются.
# Миграции применяются отдельным шагом деплоя:
#   docker compose -p ks run --rm migrate
services:
  api:
    image: ${KS_IMAGE:?задайте immutable-тег образа}
    command: ['node', 'dist/api/index.js']
    env_file: .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3010:3000'   # наружу отдаёт nginx, порт не публикуется в интернет
    volumes:
      - uploads:/app/.data/uploads
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ${KS_IMAGE:?задайте immutable-тег образа}
    command: ['node', 'dist/worker/index.js']
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/.data/uploads
    restart: unless-stopped
    # разбор Excel идёт в дочернем процессе: лимиты контейнера — граница по памяти/процессам
    mem_limit: 1g
    memswap_limit: 1280m
    pids_limit: 128

  migrate:
    image: ${KS_IMAGE:?задайте immutable-тег образа}
    command: ['node', 'dist/scripts/migrate.js']
    env_file: .env
    environment:
      NODE_ENV: production
    profiles: ['tools']
    restart: 'no'

volumes:
  uploads:
